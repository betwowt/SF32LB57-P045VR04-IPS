CONFIG_LXT_DISABLE=y
CONFIG_BSP_USING_ADC=y
CONFIG_BSP_USING_ADC1=y
CONFIG_BSP_ENABLE_AUD_PRC=y
CONFIG_BSP_AUDPRC_TX0_DMA=y
CONFIG_BSP_AUDPRC_RX0_DMA=y
CONFIG_BSP_AUDPRC_RX1_DMA=y
CONFIG_BSP_ENABLE_AUD_CODEC=y
CONFIG_BSP_USING_EPIC=y
CONFIG_BSP_USING_GPIO=y
CONFIG_BSP_USING_I2C=y
CONFIG_BSP_USING_I2C1=y
CONFIG_BSP_USING_LCPU_PATCH=y
CONFIG_BSP_USING_PINMUX=y
CONFIG_BSP_USING_PWM=y
CONFIG_BSP_USING_PWMT1=y
CONFIG_BSP_USING_PWMT2=y
CONFIG_BSP_USING_RGBLED_CH=4
CONFIG_BSP_RGB_LED_COUNT=1
CONFIG_BSP_USING_PWMA1=y
CONFIG_BSP_USING_ONCHIP_RTC=y
CONFIG_BSP_USING_SPI=y
CONFIG_BSP_USING_TIM=y
CONFIG_BSP_USING_BTIM1=y
CONFIG_BSP_USING_LPTIM1=y
CONFIG_BSP_USING_UART=y
CONFIG_BSP_USING_UART1=y
CONFIG_BSP_UART1_RX_USING_DMA=y
CONFIG_BSP_USING_LCD=y
CONFIG_LCD_USING_P045VR04_IPS_DPI=y
CONFIG_BSP_USING_TOUCHD=y
CONFIG_BSP_USING_KEY1=y
CONFIG_BSP_KEY1_PIN=34
CONFIG_BSP_KEY1_ACTIVE_HIGH=y
CONFIG_RT_USING_MTD_NOR=y
# DVP camera is off by default: it shares PA32/PA33/PA43/PA44/PA45 with
# the DPI/QADSPI panel, so only one of them can be used at a time.
# CONFIG_BSP_USING_CAMERA1 is not set

# ---- xiaozhi: audio (2x PDM mic on PA56/PA55, DAC -> NS4150B) ----
CONFIG_BSP_USING_PDM=y
CONFIG_BSP_USING_PDM1=y
CONFIG_AUDIO_RX_USING_PDM=y

# ---- xiaozhi: AIC8800D40LS-N Wi-Fi on SDIO2 (PA00..PA05) ----
# BSP_USING_SDIO is the parent switch: without it SDMMC2/SDIO2_CARD_MODE
# are silently dropped and the SDIO host is never created.
CONFIG_RT_USING_SDIO=y
CONFIG_RT_SDIO_DEBUG=y
CONFIG_BSP_USING_SDIO=y
CONFIG_BSP_USING_SDMMC2=y
CONFIG_SDIO2_CARD_MODE=2
