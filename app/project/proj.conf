CONFIG_RT_MAIN_THREAD_STACK_SIZE=4096
# Thresholds measured before +6 dB KWS/uplink makeup, with PDM gain set to 44.
CONFIG_XZ_BARGE_IN_RMS=150
CONFIG_XZ_BARGE_ARM_MIN_PRE=120
CONFIG_XZ_BARGE_ARM_RATIO=250
CONFIG_XZ_BARGE_DTD_MARGIN_PM=3000
CONFIG_RT_MAIN_THREAD_PRIORITY=15
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_USING_ISR_LOG=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_RT_TIMER_THREAD_STACK_SIZE=2048
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y

# ---- xiaozhi: network stack (Wi-Fi + WebSocket + TLS) ----
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
CONFIG_RT_LWIP_USING_MQTT=y
CONFIG_RT_LWIP_USING_WEBSOCKET=y
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
# TTS 下行 24 kHz=48 KB/s，2 KB 窗口在 ~50 ms RTT 下只能跑 ~40 KB/s，
# 且 6 个 pbuf 刚好等于窗口本身，任何突发都会发包失败→会话卡死/重连。
CONFIG_RT_LWIP_PBUF_NUM=16
CONFIG_RT_LWIP_TCP_SND_BUF=6144
CONFIG_RT_LWIP_TCP_WND=4096
CONFIG_LWIP_ALTCP=y
CONFIG_LWIP_ALTCP_TLS=y
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_PKG_USING_MBEDTLS_USE_ALL_CERTS=y
CONFIG_PKG_USING_MBEDTLS_USER_CERTS=y
CONFIG_PKG_USING_WEBCLIENT=y
CONFIG_PKG_USING_CJSON=y
CONFIG_PKG_USING_NETUTILS=y
CONFIG_PKG_NETUTILS_NTP=y
CONFIG_NETUTILS_NTP_TIMEZONE=8
CONFIG_NETUTILS_NTP_HOSTNAME="ntp.aliyun.com"

# ---- xiaozhi: audio pipeline (Opus + WebRTC 3A) ----
CONFIG_AUDIO=y
CONFIG_AUDIO_LOCAL_MUSIC=y
CONFIG_MULTI_CLIENTS_AT_WORKING=y
CONFIG_SOFTWARE_TX_MIX_ENABLE=y
CONFIG_PKG_LIB_OPUS=y
CONFIG_PKG_USING_WEBRTC=y
CONFIG_FFT_USING_CMSIS_DSP=y
CONFIG_BSP_USING_CMSIS_DSP=y
CONFIG_PSRAM_CACHE_WB=y

# ---- xiaozhi: LVGL v9 UI ----
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
CONFIG_LV_USE_TINY_TTF=y
CONFIG_LV_TINY_TTF_CACHE_GLYPH_CNT=128
CONFIG_LV_USE_SYSMON=y
CONFIG_LV_FB_LINE_NUM=16
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_RTTHREAD_USE_PSRAM_PRIVATE_HEAP=y
CONFIG_LV_RTTHREAD_PSRAM_HEAP_SIZE_KILOBYTES=3072

# ---- xiaozhi: power management and input ----
CONFIG_BSP_USING_PM=y
CONFIG_GUI_APP_PM=y
CONFIG_USING_BUTTON_LIB=y

# ---- xiaozhi: AIC8800D40LS-N SDIO Wi-Fi ----
CONFIG_AIC_WLAN_AIC8800D40N=y
CONFIG_AIC8800_RTOS_WIRELESS_PWR_VIA_IOEXP=y

# ---- xiaozhi: SoftAP provisioning (DHCP pool for the config hotspot) ----
CONFIG_LWIP_USING_DHCPD=y
CONFIG_DHCPD_SERVER_IP="192.168.4.1"
CONFIG_DHCPD_USING_ROUTER=y

# LVGL 官方快照，供 xz_snap 做无相机截图
CONFIG_LV_USE_SNAPSHOT=y

# SD music: UTF-8 long names, stack LFN workspace, FAT and a tiny ROM root.
# SDMMC2 is occupied by AIC Wi-Fi; TF uses the existing PA08/09/10 pinmux.
CONFIG_BSP_USING_SDMMC1=y
CONFIG_SDMMC1_BUS_WIDTH_1_ONLY=y
CONFIG_SDIO_CARD_MODE=0
CONFIG_RT_USING_DFS=y
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_DFS_ELM_USE_LFN_2=y
CONFIG_RT_DFS_ELM_LFN_UNICODE_2=y
CONFIG_RT_DFS_ELM_MAX_LFN=255
CONFIG_RT_DFS_ELM_MAX_SECTOR_SIZE=512
CONFIG_RT_USING_DFS_ROMFS=y
CONFIG_DFS_FILESYSTEMS_MAX=3
CONFIG_DFS_FILESYSTEM_TYPES_MAX=3
